<!-- Header -->
<header class="header">
  <div class="header-brand">
    <img src="assets/favicon.png" alt="Logo" class="header-logo">
    <h1>Quantity Measurement</h1>
  </div>
</header>

<!-- Login Section -->
<main class="auth-page">
  <div class="auth-wrapper">
    <!-- Left Side - Logo Branding (Desktop only) -->
    <div class="auth-branding">
      <div class="branding-content logo-centered">
        <img src="assets/logo-white.png" alt="Quantity Measurement Logo" class="auth-logo">
        <h2 class="app-name">Quantity Measurement</h2>
      </div>
    </div>

    <!-- Right Side - Login Form -->
    <div class="auth-form-container">
      <div class="auth-form-header">
        <h2>Login</h2>
      </div>

      <!-- Messages -->
      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Enter your email"
            required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            required>
        </div>

        <button type="submit" class="btn-auth" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>or</span></div>

      <!-- Google Login Button -->
      <div #googleBtn class="google-btn-container" id="googleButtonContainer"></div>

      <a routerLink="/" class="guest-link-btn">Continue as Guest</a>

      <div class="auth-footer">
        Don't have an account? <a routerLink="/register">Create Account</a>
      </div>
    </div>
  </div>
</main>
