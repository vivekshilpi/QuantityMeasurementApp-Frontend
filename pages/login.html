<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement - Login</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- Header (visible on mobile) -->
    <header class="header">
        <div class="header-brand">
            <img src="../images/favicon.png" alt="Logo" class="header-logo">
            <h1>Quantity Measurement</h1>
        </div>
    </header>

    <!-- Login Section -->
    <main class="auth-page">
        <div class="auth-wrapper">
            <!-- Left Side - Logo Branding (Desktop only) -->
            <div class="auth-branding">
                <div class="branding-content logo-centered">
                    <img src="../images/logo-white.png" alt="Quantity Measurement Logo" class="auth-logo">
                    <h2 class="app-name">Quantity Measurement</h2>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="auth-form-container">
                <div class="auth-form-header">
                    <h2>Login</h2>
                </div>

                <!-- Messages -->
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                        <span class="field-error" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <span class="field-error" id="passwordError"></span>
                    </div>

                    <button type="submit" class="btn-auth">Login</button>
                </form>

                <!-- Divider -->
                <div class="auth-divider"><span>or</span></div>

                <!-- Google Login Button -->
                <div id="googleButtonContainer"></div>
                <button type="button" class="btn-google" id="googleLoginBtn" style="display: none;">
                    <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="auth-footer">
                    Don't have an account? <a href="index.html">Create Account</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ===========================================
        // CONFIGURATION
        // ===========================================

        // Google Client ID from Google Cloud Console
        // Format: 123456789-abc.apps.googleusercontent.com
        // Get it from: https://console.cloud.google.com/apis/credentials
        const GOOGLE_CLIENT_ID = '761220966982-c5h3budhgbjto6q61srjp314vf7mur60.apps.googleusercontent.com';

        // Backend API URL
        const API_BASE_URL = 'http://localhost:8080';

        // ===========================================
        // CHECK IF ALREADY LOGGED IN
        // ===========================================

        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser) {
            window.location.href = 'app.html';
        }

        // ===========================================
        // DOM ELEMENTS
        // ===========================================

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        // ===========================================
        // HELPER FUNCTIONS
        // ===========================================

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }

        function loginSuccess(user, token) {
            // Store user and token
            localStorage.setItem('currentUser', JSON.stringify(user));
            if (token) localStorage.setItem('token', token);

            showSuccess('Login successful! Redirecting...');
            setTimeout(() => {
                window.location.href = 'app.html';
            }, 1000);
        }

        // ===========================================
        // CLEAR ERRORS ON INPUT
        // ===========================================

        document.getElementById('email').addEventListener('input', () => {
            emailError.textContent = '';
            errorMessage.classList.remove('show');
        });

        document.getElementById('password').addEventListener('input', () => {
            passwordError.textContent = '';
            errorMessage.classList.remove('show');
        });

        // ===========================================
        // EMAIL/PASSWORD LOGIN
        // ===========================================

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Reset messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            emailError.textContent = '';
            passwordError.textContent = '';

            // Validate
            let isValid = true;
            if (!email) {
                emailError.textContent = 'Email is required';
                isValid = false;
            } else if (!isValidEmail(email)) {
                emailError.textContent = 'Please enter a valid email';
                isValid = false;
            }
            if (!password) {
                passwordError.textContent = 'Password is required';
                isValid = false;
            }
            if (!isValid) return;

            // Show loading state
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            // Call backend API for login
            fetch(`${API_BASE_URL}/api/v1/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => {
                // Check if response is OK
                if (!res.ok) {
                    return res.text().then(text => {
                        try {
                            return JSON.parse(text);
                        } catch {
                            throw new Error(`Server returned ${res.status}: ${text || res.statusText}`);
                        }
                    });
                }
                return res.json();
            })
            .then(data => {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;

                if (data.token) {
                    loginSuccess(data.user || { email }, data.token);
                } else {
                    showError(data.message || data.error || 'Invalid email or password');
                }
            })
            .catch(err => {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                console.error('Login error:', err);

                // Show detailed error for debugging
                if (err.message.includes('Failed to fetch')) {
                    showError('Cannot connect to server. Is backend running on localhost:8080?');
                } else {
                    showError(err.message || 'Server error. Please try again.');
                }
            });
        });

        // ===========================================
        // GOOGLE LOGIN
        // ===========================================

        // Check if Google Client ID is configured (not placeholder)
        const isGoogleConfigured = GOOGLE_CLIENT_ID &&
            !GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID');

        // Initialize Google when page loads
        window.onload = function() {
            if (!isGoogleConfigured) {
                console.warn('Google Client ID not configured.');
                return;
            }

            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleResponse
                });

                // Render Google's official button
                google.accounts.id.renderButton(
                    document.getElementById('googleButtonContainer'),
                    {
                        type: 'standard',
                        theme: 'outline',
                        size: 'large',
                        text: 'continue_with',
                        shape: 'rectangular',
                        width: '100%'
                    }
                );
                console.log('Google Sign-In button rendered');
            } else {
                console.warn('Google API not loaded yet');
                // Show fallback button if Google API fails to load
                document.getElementById('googleLoginBtn').style.display = 'flex';
            }
        };

        // Handle Google response (ID token)
        function handleGoogleResponse(response) {
            const idToken = response.credential;
            console.log('Google token received, sending to backend...');

            // Send token to backend
            fetch(`${API_BASE_URL}/api/v1/auth/google-login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: idToken })
            })
            .then(res => {
                console.log('Backend response status:', res.status);
                if (!res.ok) {
                    return res.text().then(text => {
                        console.error('Backend error response:', text);
                        throw new Error(`Backend error ${res.status}: ${text || res.statusText}`);
                    });
                }
                return res.json();
            })
            .then(data => {
                console.log('Backend response data:', data);
                if (data.token) {
                    loginSuccess(data.user || parseJwt(idToken), data.token);
                } else {
                    showError(data.message || data.error || 'Google login failed');
                }
            })
            .catch(err => {
                console.error('Google login error:', err);
                if (err.message.includes('Failed to fetch')) {
                    showError('Cannot connect to backend. Is it running on localhost:8080?');
                } else {
                    showError(err.message || 'Server error. Please try again.');
                }
            });
        }

        // Decode JWT (to get user info from Google token)
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(
                    atob(base64).split('').map(c =>
                        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                    ).join('')
                ));
            } catch (e) {
                return null;
            }
        }

        // Handle OAuth redirect (if using redirect flow)
        if (window.location.hash) {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = params.get('access_token');

            if (accessToken) {
                fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                })
                .then(res => res.json())
                .then(userInfo => {
                    // Send to backend (you may need different endpoint for this flow)
                    loginSuccess(userInfo, accessToken);
                })
                .catch(() => showError('Failed to get user info'));
            }
        }
    </script>
</body>
</html>
