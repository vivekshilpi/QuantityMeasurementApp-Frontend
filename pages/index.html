<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement - Sign Up</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <!-- Google OAuth Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <img src="../images/favicon.png" alt="Logo" class="header-logo">
            <h1>Quantity Measurement</h1>
        </div>
    </header>

    <!-- Register Section -->
    <main class="auth-page">
        <div class="auth-wrapper">
            <!-- Left Side - Logo Branding (Desktop) -->
            <div class="auth-branding">
                <div class="branding-content logo-centered">
                    <img src="../images/logo-white.png" alt="Quantity Measurement Logo" class="auth-logo">
                    <h2 class="app-name">Quantity Measurement</h2>
                </div>
            </div>

            <!-- Right Side - Form -->
            <div class="auth-form-container">
                <div class="auth-form-header">
                    <h2>Create Account</h2>
                </div>

                <!-- Messages -->
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <form class="auth-form" id="registerForm">
                    <div class="form-row-inline">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" placeholder="Your name" required>
                            <span class="field-error" id="nameError"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="you@example.com" required>
                            <span class="field-error" id="emailError"></span>
                        </div>
                    </div>

                    <div class="form-row-inline">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Create password" required>
                            <span class="field-error" id="passwordError"></span>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                            <span class="field-error" id="confirmError"></span>
                        </div>
                    </div>

                    <div class="password-requirements" id="passwordRequirements">
                        <span class="requirement" id="reqLength"><span class="req-icon">○</span> 8+ chars</span>
                        <span class="requirement" id="reqUppercase"><span class="req-icon">○</span> Uppercase</span>
                        <span class="requirement" id="reqNumber"><span class="req-icon">○</span> Number</span>
                        <span class="requirement" id="reqSpecial"><span class="req-icon">○</span> Special</span>
                    </div>

                    <button type="submit" class="btn-auth">Create Account</button>
                </form>

                <!-- Divider -->
                <div class="auth-divider"><span>or</span></div>

                <!-- Google Signup Button -->
                <div id="googleButtonContainer"></div>
                <button type="button" class="btn-google" id="googleSignupBtn" style="display: none;">
                    <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Login</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ===========================================
        // CONFIGURATION
        // ===========================================

        const GOOGLE_CLIENT_ID = '761220966982-c5h3budhgbjto6q61srjp314vf7mur60.apps.googleusercontent.com';
        const API_BASE_URL = 'http://localhost:8080';

        // Check if already logged in
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser) {
            window.location.href = 'app.html';
        }

        // ===========================================
        // HELPER FUNCTIONS
        // ===========================================

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }

        // ===========================================
        // PASSWORD VALIDATION
        // ===========================================

        const passwordInput = document.getElementById('password');
        const reqLength = document.getElementById('reqLength');
        const reqUppercase = document.getElementById('reqUppercase');
        const reqNumber = document.getElementById('reqNumber');
        const reqSpecial = document.getElementById('reqSpecial');

        function checkPasswordRequirements(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
            };

            updateRequirement(reqLength, requirements.length);
            updateRequirement(reqUppercase, requirements.uppercase);
            updateRequirement(reqNumber, requirements.number);
            updateRequirement(reqSpecial, requirements.special);

            return requirements.length && requirements.uppercase && requirements.number && requirements.special;
        }

        function updateRequirement(element, isValid) {
            if (isValid) {
                element.classList.add('valid');
                element.querySelector('.req-icon').textContent = '✓';
            } else {
                element.classList.remove('valid');
                element.querySelector('.req-icon').textContent = '○';
            }
        }

        passwordInput.addEventListener('input', function() {
            checkPasswordRequirements(this.value);
            document.getElementById('passwordError').textContent = '';
            document.getElementById('errorMessage').classList.remove('show');
        });

        // ===========================================
        // DOM ELEMENTS
        // ===========================================

        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const googleSignupBtn = document.getElementById('googleSignupBtn');

        // Clear errors on input
        document.getElementById('fullName').addEventListener('input', () => {
            document.getElementById('nameError').textContent = '';
            errorMessage.classList.remove('show');
        });

        document.getElementById('email').addEventListener('input', () => {
            document.getElementById('emailError').textContent = '';
            errorMessage.classList.remove('show');
        });

        document.getElementById('confirmPassword').addEventListener('input', () => {
            document.getElementById('confirmError').textContent = '';
            errorMessage.classList.remove('show');
        });

        // ===========================================
        // NORMAL REGISTRATION
        // ===========================================

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Reset messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            document.getElementById('nameError').textContent = '';
            document.getElementById('emailError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmError').textContent = '';

            let isValid = true;

            // Validate name
            if (!fullName) {
                document.getElementById('nameError').textContent = 'Required';
                isValid = false;
            }

            // Validate email
            if (!email) {
                document.getElementById('emailError').textContent = 'Required';
                isValid = false;
            } else if (!isValidEmail(email)) {
                document.getElementById('emailError').textContent = 'Invalid email';
                isValid = false;
            }

            // Validate password
            if (!password) {
                document.getElementById('passwordError').textContent = 'Required';
                isValid = false;
            } else if (!checkPasswordRequirements(password)) {
                document.getElementById('passwordError').textContent = 'Does not meet requirements';
                isValid = false;
            }

            // Validate confirm password
            if (!confirmPassword) {
                document.getElementById('confirmError').textContent = 'Required';
                isValid = false;
            } else if (password !== confirmPassword) {
                document.getElementById('confirmError').textContent = 'Passwords do not match';
                isValid = false;
            }

            if (!isValid) return;

            // Show loading state
            const submitBtn = registerForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Creating Account...';
            submitBtn.disabled = true;

            // Call backend API for registration
            fetch(`${API_BASE_URL}/api/v1/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, password })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(data => {
                        throw new Error(data.message || 'Registration failed');
                    });
                }
                return res.json();
            })
            .then(data => {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;

                if (data.token) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);
                    showSuccess('Account created! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 1000);
                } else {
                    showError(data.message || 'Registration failed');
                }
            })
            .catch(err => {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                console.error('Registration error:', err);

                if (err.message.includes('Failed to fetch')) {
                    showError('Cannot connect to server. Is backend running on localhost:8080?');
                } else {
                    showError(err.message || 'Server error. Please try again.');
                }
            });
        });

        // ===========================================
        // GOOGLE SIGNUP
        // ===========================================

        window.onload = function() {
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleResponse
                });

                // Render Google's official button
                google.accounts.id.renderButton(
                    document.getElementById('googleButtonContainer'),
                    {
                        type: 'standard',
                        theme: 'outline',
                        size: 'large',
                        text: 'continue_with',
                        shape: 'rectangular',
                        width: '100%'
                    }
                );
                console.log('Google Sign-Up button rendered');
            } else {
                console.warn('Google API not loaded');
                document.getElementById('googleSignupBtn').style.display = 'flex';
            }
        };

        // Handle Google response - send to backend
        function handleGoogleResponse(response) {
            const idToken = response.credential;
            console.log('Google token received, sending to backend...');

            // Send token to backend API
            fetch(`${API_BASE_URL}/api/v1/auth/google-login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: idToken })
            })
            .then(res => {
                console.log('Backend response status:', res.status);
                if (!res.ok) {
                    return res.text().then(text => {
                        throw new Error(`Backend error ${res.status}: ${text}`);
                    });
                }
                return res.json();
            })
            .then(data => {
                console.log('Backend response:', data);
                if (data.token) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user || parseJwt(idToken)));
                    localStorage.setItem('token', data.token);
                    showSuccess('Account created! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 1000);
                } else {
                    showError(data.message || 'Google signup failed');
                }
            })
            .catch(err => {
                console.error('Google signup error:', err);
                if (err.message.includes('Failed to fetch')) {
                    showError('Cannot connect to backend. Is it running?');
                } else {
                    showError(err.message || 'Server error. Please try again.');
                }
            });
        }

        // Decode JWT token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(
                    atob(base64).split('').map(c =>
                        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                    ).join('')
                ));
            } catch (e) {
                return null;
            }
        }
    </script>
</body>
</html>
